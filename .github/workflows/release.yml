name: Release

on:
  push:
    branches:
      - main
  schedule:
    # Off the hour on purpose: everyone's "0 0 * * *" jobs queue at once and run late.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: TheFehr/n8n-node-tooling/.github/workflows/release.yml@b43ddaa44093916845329b1da568f29b48491b9e
    secrets:
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
