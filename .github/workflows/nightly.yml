name: Nightly compatibility

on:
  schedule:
    - cron: "34 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-compat
  cancel-in-progress: false

jobs:
  nightly:
    uses: TheFehr/n8n-node-tooling/.github/workflows/nightly-compat.yml@37ae1c9baef283f0dcce1e9c590f2a98b8f811cc
    secrets:
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
