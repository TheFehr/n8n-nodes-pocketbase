name: Nightly compatibility

on:
  schedule:
    - cron: "34 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-compat
  cancel-in-progress: false

jobs:
  nightly:
    uses: TheFehr/n8n-node-tooling/.github/workflows/nightly-compat.yml@b43ddaa44093916845329b1da568f29b48491b9e
    secrets:
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
