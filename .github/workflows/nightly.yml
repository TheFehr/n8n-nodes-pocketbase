name: Nightly compatibility

on:
  schedule:
    - cron: "34 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-compat
  cancel-in-progress: false

jobs:
  nightly:
    uses: TheFehr/n8n-node-tooling/.github/workflows/nightly-compat.yml@c0a374b61e7d8f624e6cf42efd8855dac0b13a44 # v1.0.0
    secrets:
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
