name: Nightly compatibility

on:
  schedule:
    - cron: "34 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-compat
  cancel-in-progress: false

jobs:
  nightly:
    uses: TheFehr/n8n-node-tooling/.github/workflows/nightly-compat.yml@c9563c78f8a4023216c632e5ac7c6b2e82a32dd6 # v1.2.0
    secrets:
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
